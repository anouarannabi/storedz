<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N parc - Immatriculation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f8;
    color: #1f2937;
}

.container {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 24px;
}

.card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    padding: 28px;
}

h1 {
    margin: 0;
    text-align: center;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin: 8px 0 28px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.section {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: 700;
    margin-bottom: 9px;
}

textarea {
    width: 100%;
    min-height: 420px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 14px;
    font: 16px Consolas, monospace;
    resize: vertical;
    outline: none;
}

textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.toolbar {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin: 14px 0;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 700;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    opacity: 0.9;
}

button.secondary {
    background: #e5e7eb;
    color: #111827;
}

button.danger {
    background: #dc2626;
}

button.success {
    background: #059669;
}

.status {
    margin-top: 10px;
    color: #6b7280;
    font-size: 14px;
}

footer {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin-top: 18px;
}

@media (max-width: 800px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .container {
        margin: 15px auto;
        padding: 0 12px;
    }

    .card {
        padding: 18px;
    }

    textarea {
        min-height: 300px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>N parc - Immatriculation</h1>

        <div class="subtitle">
            +213541376146
        </div>

        <div class="grid">

            <div class="section">

                <label for="input">N parc</label>

                <textarea
                    id="input"
                    placeholder="Enter N parc numbers, one per line..."
                ></textarea>

                <div class="toolbar">

                    <button onclick="processData()">
                        Process
                    </button>

                    <button
                        class="secondary"
                        onclick="deleteInput()"
                    >
                        Delete Input
                    </button>

                </div>

            </div>

            <div class="section">

                <label for="output">
                    Immatriculation
                </label>

                <textarea
                    id="output"
                    readonly
                    placeholder="Results will appear here..."
                ></textarea>

                <div class="toolbar">

                    <button
                        class="success"
                        onclick="copyResults()"
                    >
                        Copy
                    </button>

                    <button
                        class="secondary"
                        onclick="deleteOutput()"
                    >
                        Delete Results
                    </button>

                    <button
                        class="danger"
                        onclick="clearAll()"
                    >
                        Clear All
                    </button>

                </div>

                <div
                    id="status"
                    class="status"
                ></div>

            </div>

        </div>

        <footer>
            Developed by Anouar
        </footer>

    </div>

</div>

function normalize(value) {

    value = value.trim().replace(/#/g, "");

    if (/^\d+$/.test(value)) {

        value = String(parseInt(value, 10));

        return value.padStart(3, "0");

    }

    return value;
}

function processData() {

    const text =
        document.getElementById("input").value.trim();

    if (!text) {
        return;
    }

    const numbers =
        text.split(/[\s,;|]+/).filter(Boolean);

    const results =
        numbers.map(function(number) {

            const parc = normalize(number);

            return PARC_TO_IMMAT[parc] || "missed";

        });

    document.getElementById("output").value =
        results.join("\n");

    const missed =
        results.filter(function(value) {
            return value === "missed";
        }).length;

    document.getElementById("status").textContent =
        results.length + " processed | " +
        missed + " missed";
}

function copyResults() {

    const output =
        document.getElementById("output");

    if (!output.value) {
        return;
    }

    navigator.clipboard.writeText(
        output.value
    ).then(function() {

        document.getElementById("status")
            .textContent = "Results copied";

    });
}

function deleteInput() {

    document.getElementById("input").value = "";

}

function deleteOutput() {

    document.getElementById("output").value = "";

    document.getElementById("status")
        .textContent = "";
}

function clearAll() {

    deleteInput();

    deleteOutput();

}

document
    .getElementById("input")
    .addEventListener("keydown", function(event) {

        if (event.ctrlKey && event.key === "Enter") {

            processData();

        }

    });

</script>

</body>
</html>
